version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hormesis-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hormesis
    ports:
      - "5433:5432"
    volumes:
      - hormesis-pgdata:/var/lib/postgresql/data

volumes:
  hormesis-pgdata:
